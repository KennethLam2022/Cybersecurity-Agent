<h2>🎨 Agent 整体视觉风格，你倾向哪种？</h2>
<p class="subtitle">这个 Agent 要美观才能展示成果，先定调子</p>

<div class="options">
  <div class="option" data-choice="dark-cyber" onclick="toggleSelect(this)">
    <div class="letter">A</div>
    <div class="content">
      <h3>暗黑赛博风</h3>
      <p>深色背景 + 霓虹蓝绿点缀，网络安全行业的经典风格，科技感强，适合安全运维场景</p>
      <div style="display:flex;gap:8px;margin-top:8px">
        <span style="background:#0a0e17;color:#00ff88;padding:4px 12px;border-radius:4px">#0a0e17</span>
        <span style="background:#00ff88;color:#000;padding:4px 12px;border-radius:4px">#00ff88</span>
        <span style="background:#0affed;color:#000;padding:4px 12px;border-radius:4px">#0affed</span>
      </div>
    </div>
  </div>
  <div class="option" data-choice="light-pro" onclick="toggleSelect(this)">
    <div class="letter">B</div>
    <div class="content">
      <h3>浅色专业风</h3>
      <p>白色/浅灰背景 + 蓝色主色调，干净专业，适合给领导/客户展示方案</p>
      <div style="display:flex;gap:8px;margin-top:8px">
        <span style="background:#ffffff;color:#333;padding:4px 12px;border-radius:4px;border:1px solid #ddd">#ffffff</span>
        <span style="background:#1a73e8;color:#fff;padding:4px 12px;border-radius:4px">#1a73e8</span>
        <span style="background:#e8f0fe;color:#1a73e8;padding:4px 12px;border-radius:4px">#e8f0fe</span>
      </div>
    </div>
  </div>
  <div class="option" data-choice="glassmorphism" onclick="toggleSelect(this)">
    <div class="letter">C</div>
    <div class="content">
      <h3>玻璃拟态风</h3>
      <p>毛玻璃效果 + 渐变背景，现代感强，视觉效果高级，目前很流行</p>
      <div style="display:flex;gap:8px;margin-top:8px">
        <span style="background:rgba(255,255,255,0.1);backdrop-filter:blur(10px);color:#fff;padding:4px 12px;border-radius:4px;border:1px solid rgba(255,255,255,0.2)">Glass</span>
        <span style="background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;padding:4px 12px;border-radius:4px">Gradient</span>
      </div>
    </div>
  </div>
</div>
