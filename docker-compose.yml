services:
  neo4j:
    image: neo4j:5-community
    container_name: securenexus-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: "neo4j/${NEO4J_PASSWORD:?set NEO4J_PASSWORD in .env}"
    ports:
      - "${NEO4J_HTTP_PORT:-7474}:7474"
      - "${NEO4J_BOLT_PORT:-7687}:7687"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:7474 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
  securenexus:
    build:
      context: .
      dockerfile: Dockerfile
    image: securenexus:local
    container_name: securenexus
    restart: unless-stopped
    ports:
      - "${SECURENEXUS_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      APP_ENV: production
      APP_HOST: 0.0.0.0
      APP_PORT: 8000
      ALLOW_LEGACY_LOCAL_WORKSPACE: "0"
      UVICORN_WORKERS: "1"
      NEO4J_ENABLED: "${NEO4J_ENABLED:-0}"
      NEO4J_URI: "${NEO4J_URI:-bolt://neo4j:7687}"
      NEO4J_USER: "${NEO4J_USER:-neo4j}"
      NEO4J_PASSWORD: "${NEO4J_PASSWORD:-}"
      NEO4J_DATABASE: "${NEO4J_DATABASE:-neo4j}"
    volumes:
      - ./agent_data:/app/agent_data
      - ./RAG_DATA:/app/RAG_DATA
      - ./upload_staging:/app/upload_staging
      - ./backups:/app/agent_data/backups
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/stats/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  neo4j_data:
  neo4j_logs:
