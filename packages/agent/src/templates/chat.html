<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>网络安全 Agent</title>
<style>
:root{--bg:#f5f5f7;--c:#fff;--t:#1d1d1f;--t2:#6e6e73;--b:#e5e5ea;--a:#0071e3;--g:#34c759;--f:-apple-system,BlinkMacSystemFont,"SF Pro SC","PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--f);background:var(--bg);color:var(--t);height:100vh;display:flex;flex-direction:column}
.header{padding:16px 24px;background:var(--c);border-bottom:1px solid var(--b);text-align:center}
.header h1{font-size:18px;font-weight:600}
.header .sub{font-size:12px;color:var(--t2)}
.chat{flex:1;overflow-y:auto;padding:16px 24px;max-width:800px;margin:0 auto;width:100%}
.msg{margin-bottom:16px;display:flex;flex-direction:column}
.msg.user{align-items:flex-end}
.msg.assistant{align-items:flex-start}
.bubble{max-width:75%;padding:12px 16px;border-radius:16px;font-size:14px;line-height:1.6;white-space:pre-wrap}
.msg.user .bubble{background:var(--a);color:#fff;border-bottom-right-radius:4px}
.msg.assistant .bubble{background:var(--c);border:1px solid var(--b);border-bottom-left-radius:4px}
.msg.assistant .src{font-size:11px;color:var(--t2);margin-top:4px;max-width:75%}
.input-area{padding:16px 24px;background:var(--c);border-top:1px solid var(--b);max-width:800px;margin:0 auto;width:100%}
.input-row{display:flex;gap:8px}
.input-row input{flex:1;padding:12px 16px;border:1px solid var(--b);border-radius:12px;font-size:14px;font-family:var(--f);outline:none}
.input-row input:focus{border-color:var(--a)}
.input-row button{padding:12px 24px;background:var(--a);color:#fff;border:none;border-radius:12px;font-size:14px;font-weight:500;cursor:pointer;font-family:var(--f)}
.input-row button:disabled{opacity:.5;cursor:not-allowed}
.typing{color:var(--t2);font-size:13px;padding:8px 0}
.typing::after{content:'';animation:dot 1.5s infinite}
@keyframes dot{0%,20%{content:'.'}40%{content:'..'}60%,100%{content:'...'}}
.error{color:#ff3b30;font-size:13px;margin-top:4px}
</style>
</head>
<body>
<div class="header">
  <h1>网络安全知识助手</h1>
  <div class="sub">基于行业标准法规的智能问答</div>
</div>
<div class="chat" id="chat"></div>
<div class="input-area">
  <div class="input-row">
    <input type="text" id="input" placeholder="输入你的问题..." autofocus />
    <button id="send-btn" onclick="send()">发送</button>
  </div>
  <div id="status" class="typing" style="display:none">Agent 正在思考</div>
</div>

<script>
let convId = null;

function addMsg(role, text, sources) {
  const chat = document.getElementById('chat');
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.textContent = text;
  div.appendChild(bubble);
  if (role === 'assistant' && sources && sources.length > 0) {
    const src = document.createElement('div');
    src.className = 'src';
    src.textContent = '来源: ' + sources.map(s => s.display_name || s.file_name).filter((v,i,a) => a.indexOf(v)===i).join(', ');
    div.appendChild(src);
  }
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

function setStatus(show) {
  document.getElementById('status').style.display = show ? 'block' : 'none';
}

function setLoading(loading) {
  document.getElementById('send-btn').disabled = loading;
  document.getElementById('input').disabled = loading;
}

async function send() {
  const input = document.getElementById('input');
  const query = input.value.trim();
  if (!query) return;
  input.value = '';
  addMsg('user', query);
  setLoading(true);
  setStatus(true);

  try {
    const url = convId ? `/api/conversations/${convId}/chat` : '/api/chat';
    const resp = await fetch(url, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ query }),
    });
    if (!resp.ok) throw new Error('API 错误: ' + resp.status);
    const data = await resp.json();
    convId = data.conversation_id;
    addMsg('assistant', data.answer, data.sources);
  } catch (e) {
    addMsg('assistant', '抱歉，请求失败: ' + e.message);
  } finally {
    setLoading(false);
    setStatus(false);
    document.getElementById('input').focus();
  }
}

document.getElementById('input').addEventListener('keydown', function(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    send();
  }
});
</script>
</body>
</html>
