<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>安枢 SecureNexus</title>
    <link rel="stylesheet" href="/static/style.css">
    <style>
        .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
        .source-score{font-size:10px;color:var(--t2);text-align:right;flex-shrink:0}
        .rating-bar{display:flex;align-items:center;gap:4px;padding:8px 0 4px;border-top:1px solid var(--b);margin-top:8px}
        .rating-star{cursor:pointer;width:22px;height:22px;transition:transform .15s,filter .15s;flex-shrink:0}
        .rating-star:hover{transform:scale(1.2)}
        .rating-star.active{filter:drop-shadow(0 0 3px rgba(255,170,0,.5))}
        .rating-label{font-size:11px;color:var(--t2);margin-left:6px;white-space:nowrap}
        .rating-locked{font-size:11px;color:var(--g);margin-left:6px;font-weight:500}
        .feedback-actions{display:flex;gap:5px;margin-top:8px;padding-top:6px;border-top:1px solid var(--b);justify-content:flex-end}
        .feedback-actions button{border:0;background:transparent;color:var(--t2);font-size:11px;padding:2px 5px;cursor:pointer}
        .feedback-actions button:hover{color:var(--a)}
        .feedback-actions button:disabled{opacity:.5;cursor:wait}
        .warning-banner{background:#fff3cd;border:1px solid #ffc107;border-radius:8px;padding:8px 14px;font-size:12px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;color:#664d03}
        .warning-banner .close{cursor:pointer;font-size:16px;opacity:.6;border:none;background:none;color:#664d03;padding:0 4px}
        .warning-banner .close:hover{opacity:1}
        .warning-annotation{font-size:11px;color:#999;margin-top:6px;padding-top:6px;border-top:1px dashed #eee;display:flex;align-items:center;gap:4px}
        .warning-annotation::before{content:"⚠️";font-size:10px}
        .conv-item{display:flex;flex-direction:column;gap:2px}
        .conv-item-row{display:flex;align-items:center;gap:6px;cursor:pointer;flex:1;min-width:0}
        .conv-item-actions{display:flex;gap:2px;opacity:0;transition:opacity .15s}
        .conv-item:hover .conv-item-actions{opacity:1}
        .conv-item-rename{background:none;border:none;cursor:pointer;color:var(--a);font-size:14px;padding:0 4px;line-height:1}
        .conv-item-rename:hover{color:#005bb5}
        .rename-input{border:1px solid var(--a);border-radius:4px;padding:2px 6px;font-size:13px;font-family:var(--f);outline:none;width:100%;background:#fff}
        .last-badge{font-size:9px;background:var(--a);color:#fff;padding:1px 5px;border-radius:6px;font-weight:600;flex-shrink:0}
        .top-last{border-bottom:2px solid var(--a)!important;background:#f0f7ff}
        .account-bar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:10px;padding-top:9px;border-top:1px solid var(--b)}
        .account-label{font-size:11px;color:var(--t2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
        .account-btn{background:transparent;border:1px solid var(--b);border-radius:5px;color:var(--t2);font:500 11px var(--f);padding:4px 8px;cursor:pointer;flex-shrink:0}
        .account-btn:hover{border-color:var(--a);color:var(--a)}
        .account-modal{position:fixed;inset:0;background:rgba(17,24,39,.35);display:flex;align-items:center;justify-content:center;padding:16px;z-index:30}
        .account-card{width:min(400px,100%);background:#fff;border:1px solid var(--b);border-radius:8px;padding:20px;box-shadow:0 16px 40px rgba(0,0,0,.18)}
        .account-card h2{font-size:16px;margin:0 0 5px}.account-card p{font-size:12px;color:var(--t2);margin:0 0 16px;line-height:1.5}
        .account-card label{display:block;font-size:12px;color:var(--t2);margin:10px 0 5px}.account-card input{width:100%;border:1px solid var(--b);border-radius:6px;padding:9px;font:13px var(--f);outline:none}.account-card input:focus{border-color:var(--a)}
        .account-actions{display:flex;gap:8px;align-items:center;margin-top:18px}.account-actions .primary{background:var(--a);color:#fff;border:0;border-radius:6px;padding:8px 13px;font:600 12px var(--f);cursor:pointer}.account-actions .secondary{background:#fff;color:var(--t2);border:1px solid var(--b);border-radius:6px;padding:8px 13px;font:500 12px var(--f);cursor:pointer}.account-login-error{min-height:16px;color:var(--r);font-size:11px;line-height:1.45;margin-top:5px}.account-status{font-size:11px;color:var(--r);min-height:16px;margin-top:10px}
        .notification-btn{position:relative;width:28px;height:28px;border:1px solid var(--b);border-radius:5px;background:#fff;color:var(--t2);cursor:pointer;font-size:15px;line-height:1}.notification-btn:hover{border-color:var(--a);color:var(--a)}.notification-badge{position:absolute;right:-5px;top:-5px;min-width:15px;height:15px;border-radius:8px;background:var(--r);color:#fff;font-size:9px;line-height:15px;text-align:center;font-weight:600}.notification-popover{position:fixed;z-index:35;left:14px;top:96px;width:min(360px,calc(100vw - 28px));max-height:min(480px,calc(100vh - 120px));overflow:auto;background:#fff;border:1px solid var(--b);border-radius:8px;box-shadow:0 14px 36px rgba(0,0,0,.18);padding:12px}.notification-popover-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding-bottom:9px;border-bottom:1px solid var(--b);font-size:12px;font-weight:600}.notification-item{padding:10px 0;border-bottom:1px solid var(--b);cursor:pointer}.notification-item:last-child{border-bottom:0}.notification-item.unread .notification-title{font-weight:700}.notification-title{font-size:12px}.notification-body{font-size:11px;color:var(--t2);line-height:1.45;margin-top:3px}.notification-meta{font-size:10px;color:var(--t2);margin-top:5px;display:flex;gap:7px}.notification-severity{font-weight:600}
    </style>
</head>
<body>
<div class="app" id="app">
    <!-- 侧边栏遮罩（移动端） -->
    <div class="sidebar-backdrop" id="sidebarBackdrop" onclick="toggleSidebar()"></div>

    <!-- 侧边栏 -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <h1>安枢 <span style="font-size:12px;font-weight:500;color:var(--t2)">SecureNexus</span></h1>
            <p>连接安全知识，驱动可信行动。</p>
            <div class="account-bar"><span class="account-label" id="accountLabel">本地默认工作区</span><select id="workspaceSelect" aria-label="当前工作区" onchange="switchWorkspace(this.value)" style="display:none;max-width:120px;border:1px solid var(--b);border-radius:5px;padding:4px;background:#fff;color:var(--t2);font:11px var(--f)"></select><select id="agentSelect" aria-label="当前 Agent" onchange="switchAgent(this.value)" style="display:none;max-width:120px;border:1px solid var(--b);border-radius:5px;padding:4px;background:#fff;color:var(--t2);font:11px var(--f)"></select><select id="languageSelect" aria-label="语言" onchange="changeLanguage(this.value)" style="max-width:76px;border:1px solid var(--b);border-radius:5px;padding:4px;background:#fff;color:var(--t2);font:11px var(--f)"><option value="zh-CN">中文</option><option value="en-US">English</option></select><button class="notification-btn" id="notificationButton" onclick="toggleNotificationPanel()" title="通知" aria-label="通知" style="display:none">🔔<span class="notification-badge" id="notificationBadge" style="display:none">0</span></button><button class="account-btn" id="accountButton" onclick="openAccountModal()">账户</button></div>
        </div>
        <div class="notification-popover" id="notificationPopover" style="display:none">
        <div class="notification-popover-head"><span id="notificationTitle">通知</span><button class="account-btn" id="markAllReadButton" onclick="markAllNotificationsRead()">全部已读</button></div>
          <div id="notificationItems" style="padding-top:2px"></div>
        </div>
        <button class="new-chat-btn" onclick="newConversation()">+ 新对话</button>
        <div class="conv-list" id="convList"></div>
    </aside>

    <!-- 主聊天区 -->
    <main class="chat-area">
        <div class="chat-header">
            <div style="display:flex;align-items:center;gap:10px;min-width:0">
                <button class="menu-toggle" id="menuToggle" aria-label="打开或关闭对话列表" title="打开或关闭对话列表" onclick="toggleSidebar()">☰</button>
                <div class="chat-header-title" id="chatTitle" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">新对话</div>
            </div>
            <div class="chat-header-status">
                <span class="status-dot"></span>
                <span id="statusText">就绪</span>
            </div>
        </div>

        <div class="chat-messages" id="chatMessages"></div>

        <div class="chat-input-area">
            <div id="warningBanner" class="warning-banner" style="display:none;">
                <span id="warningBannerText"></span>
                <button class="close" onclick="dismissWarning()">&times;</button>
            </div>
            <div class="chat-input-row">
                <label for="chatInput" class="sr-only">输入网络安全问题</label>
                <textarea class="chat-input" id="chatInput"
                          placeholder="输入你的问题，例如：等保三级对安全计算环境有什么要求？"
                          rows="1" maxlength="2000"></textarea>
                <button class="send-btn" id="sendBtn" aria-label="发送问题" onclick="sendMessage()">发送</button>
            </div>
        </div>
    </main>
</div>

<div class="account-modal" id="accountModal" style="display:none" role="dialog" aria-modal="true" aria-labelledby="accountTitle">
  <div class="account-card">
    <h2 id="accountTitle">登录安枢</h2>
    <p id="accountDescription">登录后，对话将保存到你的独立工作区。</p>
    <label for="accountName" id="accountNameLabel">显示名称（注册时填写）</label>
    <input id="accountName" maxlength="80" autocomplete="name" placeholder="例如：张三">
    <label for="accountEmail" id="accountEmailLabel">邮箱</label>
    <input id="accountEmail" type="email" autocomplete="email" placeholder="name@example.com">
    <label for="accountPassword" id="accountPasswordLabel">密码</label>
    <input id="accountPassword" type="password" autocomplete="current-password" placeholder="至少 10 位">
    <div class="account-login-error" id="accountLoginError" role="alert" aria-live="polite"></div>
    <div class="account-status" id="accountStatus"></div>
    <div id="ssoSection" style="display:none;margin-top:14px;padding-top:12px;border-top:1px solid var(--b)">
      <div style="font-size:12px;color:var(--t2);margin-bottom:8px" id="ssoTitle">企业账号登录</div>
      <div id="ssoProviderButtons" style="display:flex;flex-direction:column;gap:7px"></div>
      <div id="ssoLdapForm" style="display:none;margin-top:8px">
        <label for="ssoLdapUsername" id="ssoLdapUsernameLabel">LDAP 用户名</label>
        <input id="ssoLdapUsername" autocomplete="username" placeholder="sAMAccountName / UPN">
        <label for="ssoLdapPassword" id="ssoLdapPasswordLabel">LDAP 密码</label>
        <input id="ssoLdapPassword" type="password" autocomplete="current-password" placeholder="密码">
        <button class="secondary" style="margin-top:8px" id="ldapLoginButton" onclick="submitLdapSso()">使用 LDAP 登录</button>
      </div>
    </div>
    <div id="memorySettings" style="display:none;margin-top:16px;padding-top:14px;border-top:1px solid var(--b)"><label style="display:flex;align-items:center;gap:7px;margin:0" id="memoryEnabledLabel"><input type="checkbox" id="memoryEnabled" onchange="setMemoryEnabled(this.checked)"> 启用跨会话长期记忆</label><div style="margin-top:8px"><button class="secondary" id="manageMemoriesButton" onclick="loadMyMemories()">管理我的记忆</button><button class="secondary" id="myUsageButton" onclick="loadMyUsage()">我的用量</button><button class="secondary" id="myGenerationsButton" onclick="loadMyGenerations()">我的生成物</button><button class="secondary" id="changePasswordButton" onclick="changeMyPassword()">修改密码</button><button class="secondary" id="exportDataButton" onclick="exportMyData()">导出数据</button><button class="secondary" id="logoutButton" onclick="logoutAccount()">退出登录</button></div><button class="secondary" style="margin-top:8px;color:var(--r)" id="deletionButton" onclick="requestAccountDeletion()">申请注销账号</button><div id="memoryList" style="display:none;margin-top:10px;max-height:180px;overflow:auto"></div><div id="usageList" style="display:none;margin-top:10px"></div><div id="generationList" style="display:none;margin-top:10px;max-height:220px;overflow:auto"></div></div>
    <div class="account-actions"><button class="primary" id="accountSubmit" onclick="submitAccount('login')">登录</button><button class="secondary" id="registerButton" onclick="location.href='/register?next=/chat'">注册工作区</button><button class="secondary" id="cancelAccountButton" onclick="closeAccountModal()">取消</button></div>
  </div>
</div>

<script>
document.addEventListener('keydown', function(event) {
    if (event.key !== 'Escape') return;
    const modal = document.getElementById('accountModal');
    if (modal && modal.style.display !== 'none') closeAccountModal();
    const popover = document.getElementById('notificationPopover');
    if (popover && popover.style.display !== 'none') toggleNotificationPanel();
});
let currentConvId = null;
let isLoading = false;
let _lastWarningMsg = '';  // 上次的 Ollama 告警消息
let _ratingTimers = {};
let _ratedMessages = {};
let currentMemoryItems = [];
let responseLanguage = localStorage.getItem('securenexus_language') || 'zh-CN';
const UI_TRANSLATIONS = {
    'zh-CN': {
        account: '账户', notification: '通知', markAllRead: '全部已读', accountTitle: '登录安枢', accountDescription: '登录后，对话将保存到你的独立工作区。', name: '显示名称（注册时填写）', email: '邮箱', password: '密码', enterprise: '企业账号登录', ldapUser: 'LDAP 用户名', ldapPassword: 'LDAP 密码', ldapLogin: '使用 LDAP 登录', memory: '启用跨会话长期记忆', memories: '管理我的记忆', usage: '我的用量', generations: '我的生成物', changePassword: '修改密码', exportData: '导出数据', logout: '退出登录', deleteAccount: '申请注销账号', login: '登录', register: '注册工作区', cancel: '取消', send: '发送', newChat: '+ 新对话', ready: '就绪', localWorkspace: '本地默认工作区', loginStatus: '登录中...', registering: '创建工作区中...', ldapStatus: 'LDAP 登录中...', invalidFields: '请填写邮箱和密码。', invalidLdap: '请填写 LDAP 用户名和密码。'
    },
    'en-US': {
        account: 'Account', notification: 'Notifications', markAllRead: 'Mark all read', accountTitle: 'Sign in to SecureNexus', accountDescription: 'Sign in to save conversations in your private workspace.', name: 'Display name (for registration)', email: 'Email', password: 'Password', enterprise: 'Enterprise account', ldapUser: 'LDAP username', ldapPassword: 'LDAP password', ldapLogin: 'Sign in with LDAP', memory: 'Enable cross-session memory', memories: 'Manage my memories', usage: 'My usage', generations: 'My generated files', changePassword: 'Change password', exportData: 'Export my data', logout: 'Sign out', deleteAccount: 'Request account deletion', login: 'Sign in', register: 'Register workspace', cancel: 'Cancel', send: 'Send', newChat: '+ New chat', ready: 'Ready', localWorkspace: 'Local default workspace', loginStatus: 'Signing in...', registering: 'Creating workspace...', ldapStatus: 'Signing in with LDAP...', invalidFields: 'Enter an email and password.', invalidLdap: 'Enter an LDAP username and password.'
    }
};
function uiText(key) { return (UI_TRANSLATIONS[responseLanguage] || UI_TRANSLATIONS['zh-CN'])[key] || key; }
function applyUiLanguage() {
    const ids = {accountButton:'account', notificationTitle:'notification', markAllReadButton:'markAllRead', accountTitle:'accountTitle', accountDescription:'accountDescription', accountNameLabel:'name', accountEmailLabel:'email', accountPasswordLabel:'password', ssoTitle:'enterprise', ssoLdapUsernameLabel:'ldapUser', ssoLdapPasswordLabel:'ldapPassword', ldapLoginButton:'ldapLogin', memoryEnabledLabel:'memory', manageMemoriesButton:'memories', myUsageButton:'usage', myGenerationsButton:'generations', changePasswordButton:'changePassword', exportDataButton:'exportData', logoutButton:'logout', deletionButton:'deleteAccount', accountSubmit:'login', registerButton:'register', cancelAccountButton:'cancel', sendBtn:'send'};
    Object.entries(ids).forEach(([id, key]) => {
        const el = document.getElementById(id);
        if (!el) return;
        if (id === 'memoryEnabledLabel') {
            const input = el.querySelector('input');
            el.textContent = '';
            if (input) el.appendChild(input);
            el.appendChild(document.createTextNode(' ' + uiText(key)));
        } else {
            el.textContent = uiText(key);
        }
    });
    const newChat = document.querySelector('.new-chat-btn'); if (newChat) newChat.textContent = uiText('newChat');
    const status = document.getElementById('statusText'); if (status) status.textContent = uiText('ready');
    const label = document.getElementById('accountLabel'); if (label && (!label.textContent || label.textContent === '本地默认工作区' || label.textContent === 'Local default workspace')) label.textContent = uiText('localWorkspace');
}
const nativeFetch = window.fetch.bind(window);
function browserCsrfToken() { const match = document.cookie.match(/(?:^|; )securenexus_csrf=([^;]+)/); return match ? decodeURIComponent(match[1]) : ''; }
window.fetch = (input, init = {}) => {
    const url = typeof input === 'string' ? input : input.url;
    if (!url || (!url.startsWith('/') && !url.startsWith(window.location.origin))) return nativeFetch(input, init);
    const headers = new Headers(init.headers || (typeof input === 'object' ? input.headers : undefined) || {});
    const method = String(init.method || (typeof input === 'object' && input.method) || 'GET').toUpperCase();
    const csrf = browserCsrfToken();
    if (csrf && ['POST', 'PUT', 'PATCH', 'DELETE'].includes(method)) headers.set('X-CSRF-Token', csrf);
    return nativeFetch(input, {...init, headers, credentials: 'same-origin'});
};

// ===== 侧边栏切换（移动端） =====
function toggleSidebar() {
    document.getElementById('sidebar').classList.toggle('open');
    document.getElementById('sidebarBackdrop').classList.toggle('show');
}

// ===== 初始加载 =====
async function init() {
    applyUiLanguage();
    const authenticated = await refreshAccount();
    if (!authenticated) {
        location.replace('/login?next=/chat');
        return;
    }
    await loadConversations();
    if (currentConvId) {
        await loadMessages(currentConvId);
    }
}

async function refreshAccount() {
    let response;
    let data;
    try {
        response = await fetch('/api/auth/me');
        if (!response.ok) return false;
        data = await response.json();
    } catch (_) {
        return false;
    }
    // Only the authentication response can decide whether the session is valid.
    // Optional UI/account widgets must not turn a valid session into a login redirect.
    if (!data.authenticated) {
        document.getElementById('accountLabel').textContent = '本地默认工作区';
        document.getElementById('agentSelect').style.display = 'none';
        document.getElementById('workspaceSelect').style.display = 'none';
        document.getElementById('notificationButton').style.display = 'none';
        document.getElementById('notificationPopover').style.display = 'none';
        return false;
    }
    try {
        const label = document.getElementById('accountLabel');
        const workspaceSelect = document.getElementById('workspaceSelect');
        const agentSelect = document.getElementById('agentSelect');
        responseLanguage = data.language || responseLanguage;
        document.getElementById('languageSelect').value = responseLanguage;
        label.textContent = data.display_name || data.email || '已登录工作区';
        const workspaces = Array.isArray(data.workspaces) ? data.workspaces : [];
        workspaceSelect.innerHTML = workspaces.map(workspace => `<option value="${escHtml(workspace.id)}" ${workspace.id === data.tenant_id ? 'selected' : ''}>${escHtml(workspace.name)}</option>`).join('');
        workspaceSelect.style.display = workspaces.length > 1 ? '' : 'none';
        const agents = Array.isArray(data.agents) ? data.agents : [];
        agentSelect.innerHTML = agents.map(agent => `<option value="${escHtml(agent.id)}" ${agent.id === data.agent_id ? 'selected' : ''}>${escHtml(agent.name)}</option>`).join('');
        agentSelect.style.display = agents.length > 1 ? '' : 'none';
        document.getElementById('memorySettings').style.display = '';
        const memoryResp = await fetch('/api/memories');
        if (memoryResp.ok) {
            const memoryData = await memoryResp.json();
            document.getElementById('memoryEnabled').checked = !!memoryData.enabled;
        }
        document.getElementById('notificationButton').style.display = '';
        await refreshNotificationBadge();
    } catch (error) {
        console.warn('账户界面初始化部分失败，保持当前登录状态', error);
    }
    return true;
}

function notificationSeverityText(severity) {
    return {info:'信息',success:'完成',warning:'提醒',error:'错误',critical:'高危'}[severity] || '信息';
}

async function refreshNotificationBadge() {
    try {
        const response = await fetch('/api/notifications?limit=1');
        const data = await response.json();
        if (!response.ok) return;
        const count = Number(data.summary?.unread || 0);
        const badge = document.getElementById('notificationBadge');
        badge.textContent = count > 99 ? '99+' : String(count);
        badge.style.display = count ? '' : 'none';
    } catch (_) {}
}

async function toggleNotificationPanel() {
    const panel = document.getElementById('notificationPopover');
    const opening = panel.style.display === 'none';
    panel.style.display = opening ? 'block' : 'none';
    if (opening) await loadMyNotifications();
}

async function loadMyNotifications() {
    const box = document.getElementById('notificationItems');
    box.textContent = '加载中...';
    try {
        const response = await fetch('/api/notifications?limit=50&status=unread,read');
        const data = await response.json();
        if (!response.ok) throw new Error(data.detail || '通知加载失败');
        const items = data.items || [];
        if (!items.length) {
            box.innerHTML = '<div style="padding:14px 0;color:var(--t2);font-size:12px">暂无通知</div>';
            await refreshNotificationBadge();
            return;
        }
        box.innerHTML = items.map(item => {
            const idArg = JSON.stringify(item.id).replace(/"/g, '&quot;');
            const linkArg = JSON.stringify(item.link_path || '').replace(/"/g, '&quot;');
            return '<div class="notification-item ' + (item.status === 'unread' ? 'unread' : '') + '" onclick="openMyNotification(' + idArg + ',' + linkArg + ')"><div class="notification-title"><span class="notification-severity">' + notificationSeverityText(item.severity) + '</span> · ' + escapeHtml(item.title) + '</div><div class="notification-body">' + escapeHtml(item.body || '') + '</div><div class="notification-meta"><span>' + escapeHtml(item.created_at || '--') + '</span><span>' + escapeHtml(item.status) + '</span></div></div>';
        }).join('');
        await refreshNotificationBadge();
    } catch (error) {
        box.innerHTML = '<div style="padding:14px 0;color:var(--r);font-size:12px">' + escapeHtml(error.message || '通知加载失败') + '</div>';
    }
}

async function markNotifications(ids, status) {
    if (!ids.length) return;
    const response = await fetch('/api/notifications/status', {
        method: 'PUT', headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ids, status}),
    });
    if (!response.ok) {
        const data = await response.json().catch(() => ({}));
        throw new Error(data.detail || '通知更新失败');
    }
}

async function openMyNotification(id, linkPath) {
    try { await markNotifications([id], 'read'); } catch (_) {}
    document.getElementById('notificationPopover').style.display = 'none';

        }
    } finally { submit.disabled = false; }
}

// 时间分组工具
function getDatePeriod(dateStr) {
  const d = new Date(dateStr);
  const now = new Date();
  const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const yesterday = new Date(today);
  yesterday.setDate(yesterday.getDate() - 1);
  const weekStart = new Date(today);
  weekStart.setDate(weekStart.getDate() - today.getDay());
  const monthStart = new Date(today.getFullYear(), today.getMonth(), 1);
  if (d >= today) return '今天';
  if (d >= yesterday) return '昨天';
  if (d >= weekStart) return '本周';
  if (d >= monthStart) return '本月';
  return '更早';
}
function getPeriodOrder(p) {
  return {'今天':0,'昨天':1,'本周':2,'本月':3,'更早':4}[p] || 99;
}

// ===== 对话列表（需求1: ≤10不折叠; 需求3: 最后一次不折叠） =====
let collapsedConvGroups = { '昨天': true, '本周': true, '本月': true, '更早': true };
let _renamingConvId = null;

async function loadConversations() {
    const resp = await fetch('/api/conversations');
    const convs = await resp.json();
    const list = document.getElementById('convList');

    // 需求1: ≤10 条直接展示平铺列表，不分组
    if (convs.length <= 10) {
      list.innerHTML = convs.map(c => `
        <div class="conv-item${c.id === currentConvId ? ' active' : ''}" data-conv-id="${c.id}">
          <div class="conv-item-row" onclick="switchConversation('${c.id}')">
            <span class="conv-item-title">${escapeHtml(c.title)}</span>
          </div>
          <div class="conv-item-actions">
            <button class="conv-item-rename" onclick="event.stopPropagation();startRename('${c.id}')" title="重命名">✎</button>
            <button class="conv-item-del" onclick="event.stopPropagation();deleteConversation('${c.id}')">×</button>
          </div>
        </div>
      `).join('') || '<div class="empty-state">暂无对话</div>';
      updateConvList();
      if (!currentConvId && convs.length > 0) {
          currentConvId = convs[0].id;
          await loadMessages(currentConvId);
          updateConvList();
      }
      return;
    }

    // >10 条，按时间分组
    const groups = {};
    for (const c of convs) {
      const period = getDatePeriod(c.updated_at);
      if (!groups[period]) groups[period] = [];
      groups[period].push(c);
    }

    const sortedPeriods = Object.keys(groups).sort((a,b) => getPeriodOrder(a) - getPeriodOrder(b));

    list.innerHTML = sortedPeriods.map(period => {
      const items = groups[period];
      // 需求3: 最后一次对话不折叠
      const lastConv = period === '今天' ? items[0] : null;
      const isCollapsed = collapsedConvGroups[period];
      return `
        <div class="conv-group">
          <div class="conv-group-header" onclick="toggleConvGroup('${period}')">
            <span class="arrow ${isCollapsed ? 'collapsed' : ''}">▾</span>
            <span class="group-label">${period}</span>
            <span class="group-count">${items.length}</span>
          </div>
          <div class="conv-group-items" style="display:${isCollapsed ? 'none' : 'block'}">
            ${items.map((c, idx) => {
              // 需求3: 今天分组中的第一条（最新对话）始终展开，不受折叠影响
              const show = period === '今天' && idx === 0;
              if (show) return ''; // 在分组外部单独渲染
              return `
                <div class="conv-item${c.id === currentConvId ? ' active' : ''}" data-conv-id="${c.id}">
                  <div class="conv-item-row" onclick="switchConversation('${c.id}')">
                    <span class="conv-item-title">${escapeHtml(c.title)}</span>
                  </div>
                  <div class="conv-item-actions">
                    <button class="conv-item-rename" onclick="event.stopPropagation();startRename('${c.id}')" title="重命名">✎</button>
                    <button class="conv-item-del" onclick="event.stopPropagation();deleteConversation('${c.id}')">×</button>
                  </div>
                </div>`;
            }).join('')}
          </div>
        </div>`;
    }).join('');

    // 需求3: 最后一次对话（今天第一条）单独渲染在顶部
    const todayItems = groups['今天'];
    if (todayItems && todayItems.length > 0) {
      const last = todayItems[0];
      const topItem = document.createElement('div');
      topItem.className = 'conv-item top-last' + (last.id === currentConvId ? ' active' : '');
      topItem.dataset.convId = last.id;
      topItem.innerHTML = `
        <div class="conv-item-row" onclick="switchConversation('${last.id}')">
          <span class="conv-item-title">${escapeHtml(last.title)}</span>
          <span class="last-badge">最新</span>
        </div>
        <div class="conv-item-actions">
          <button class="conv-item-rename" onclick="event.stopPropagation();startRename('${last.id}')" title="重命名">✎</button>
          <button class="conv-item-del" onclick="event.stopPropagation();deleteConversation('${last.id}')">×</button>
        </div>
      `;
      list.insertBefore(topItem, list.firstChild);
    }

    updateConvList();

    if (!currentConvId && convs.length > 0) {
        currentConvId = convs[0].id;
        await loadMessages(currentConvId);
        updateConvList();
    }
}

// 需求2: 对话改名
function startRename(convId) {
  const item = document.querySelector(`.conv-item[data-conv-id="${convId}"]`);
  if (!item) return;
  const titleEl = item.querySelector('.conv-item-title');
  const currentTitle = titleEl.textContent;
  const input = document.createElement('input');
  input.className = 'rename-input';
  input.value = currentTitle;
  input.maxLength = 100;
  titleEl.replaceWith(input);
  input.focus();
  input.select();
  _renamingConvId = convId;

  const saveRename = async () => {
    const newTitle = input.value.trim();
    if (newTitle && newTitle !== currentTitle) {
      try {
        await fetch(`/api/conversations/${convId}`, {
          method: 'PUT',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({title: newTitle}),
        });
      } catch(e) { console.error('改名失败:', e); }
    }
    _renamingConvId = null;
    await loadConversations();
  };

  input.addEventListener('blur', saveRename);
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') { input.blur(); }
    if (e.key === 'Escape') { _renamingConvId = null; loadConversations(); }
  });
}

// ===== 消息加载 =====
async function loadMessages(convId) {
    const resp = await fetch(`/api/conversations/${convId}/messages`);
    const messages = await resp.json();
    const container = document.getElementById('chatMessages');
    container.innerHTML = '';

    if (messages.length === 0) {
        container.innerHTML = '<div style="text-align:center;color:#999;margin-top:60px;font-size:14px;">开始一段新的对话</div>';
        document.getElementById('chatTitle').textContent = '新对话';
        return;
    }

    let previousUserQuery = '';
    const historyRatings = {};
    messages.forEach(m => {
        if (m.role === 'user') previousUserQuery = m.content || '';
        const recorded = m.user_rating != null ? m.user_rating : (m.semantic_rating != null ? m.semantic_rating : null);
        if (m.role === 'assistant' && m.id != null && recorded != null) historyRatings[m.id] = recorded;
        appendMessage(m.role, m.content, m.sources, m.id, previousUserQuery);
    });
    // Lock already-recorded stars on history replay so they do not reschedule
    // the semantic fallback timer or allow re-rating old messages.
    if (Object.keys(historyRatings).length > 0) {
        appendRating._lockedOverride = historyRatings;
    }

    // 更新标题
    if (messages.length > 0) {
        const firstUser = messages.find(m => m.role === 'user');
        if (firstUser) {
            document.getElementById('chatTitle').textContent = firstUser.content.substring(0, 50);
        }
    }

    scrollToBottom();
}

// ===== 发送消息（流式 SSE） =====
async function sendMessage() {
    if (isLoading) return;
    const input = document.getElementById('chatInput');
    const query = input.value.trim();
    if (!query) return;

    // P5 generation intents are resolved before opening the normal streaming RAG path.
    try {
        const routeResponse = await fetch('/api/generation/route', {
            method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({query}),
        });
        const routeData = await routeResponse.json();
        if (!routeResponse.ok) throw new Error(routeData.detail || '能力路由失败');
        const route = routeData.route || {};
        if (route.mode && route.mode !== 'chat') {
            appendMessage('user', query);
            input.value = '';
            input.style.height = 'auto';
            if (route.clarification) {
                appendGenerationClarification(query, route);
            } else if (routeData.generation) {
                appendGenerationOutline(routeData.generation);
            }
            scrollToBottom();
            return;
        }
    } catch (error) {
        console.warn('P5 能力路由不可用，继续普通问答：', error);
    }

    isLoading = true;
    document.getElementById('sendBtn').disabled = true;
    document.getElementById('statusText').textContent = '生成中...';

    if (!currentConvId) {
        const resp = await fetch('/api/conversations', { method: 'POST' });
        const conv = await resp.json();
        currentConvId = conv.id;
        await loadConversations();
    }

    // 显示用户消息
    appendMessage('user', query);
    scrollToBottom();
    input.value = '';
    input.style.height = 'auto';

    // 创建助手消息占位容器（含输入指示器）
    const container = document.getElementById('chatMessages');
    const msgDiv = document.createElement('div');
    msgDiv.className = 'message assistant';
    msgDiv.innerHTML = `<div class="message-role">助手</div><div class="message-bubble"><div class="typing-indicator"><span></span><span></span><span></span></div><span class="typing-text">正在分析...</span></div>`;
    container.appendChild(msgDiv);
    const bubble = msgDiv.querySelector('.message-bubble');

    let fullContent = '';
    let reasoningContent = '';
    let sourcesData = null;
    let assistantMessageId = null;
    let answerCompleted = false;
    let newConvId = currentConvId;

    function renderCurrentBubble() {
        const reasoningHtml = reasoningContent ? renderReasoning(reasoningContent) : '';
        bubble.innerHTML = reasoningHtml + formatContent(fullContent);
        if (answerCompleted) {
            renderSourcesIntoBubble(bubble, sourcesData);
            if (assistantMessageId) {
                appendRating(bubble, assistantMessageId);
                appendFeedbackActions(bubble, assistantMessageId, query);
            }
        }
        scrollToBottom();
    }

    try {
        const response = await fetch('/api/chat/stream', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ query, conversation_id: currentConvId, language: responseLanguage }),
        });

        if (!response.ok) {
            throw new Error(`HTTP ${response.status}`);
        }

        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let buffer = '';
        let receivedDone = false;

        while (true) {
            const { done, value } = await reader.read();
            if (done) break;

            buffer += decoder.decode(value, { stream: true });
            const lines = buffer.split('\n');
            buffer = lines.pop() || '';

            for (const line of lines) {
                const trimmed = line.trim();
                if (!trimmed || !trimmed.startsWith('data: ')) continue;

                try {
                    const event = JSON.parse(trimmed.slice(6));

                    switch (event.type) {
                        case 'status':
                            document.getElementById('statusText').textContent = event.message || event.stage;
                            break;

                        case 'reasoning':
                            reasoningContent += event.content;
                            renderCurrentBubble();
                            break;

                        case 'token':
                            fullContent += event.content;
                            renderCurrentBubble();
                            break;

                        case 'answer_replace':
                            fullContent = event.content || fullContent;
                            renderCurrentBubble();
                            break;

                        case 'error':
                            fullContent += `\n\n<hr><p style="color:#e53e3e;">${event.content}</p>`;
                            bubble.innerHTML = formatContent(fullContent);
                            scrollToBottom();
                            break;

                        case 'sources':
                            sourcesData = event.sources;
                            assistantMessageId = event.message_id || assistantMessageId;
                            newConvId = event.conversation_id || newConvId;
                            if (newConvId) currentConvId = newConvId;
                            renderCurrentBubble();
                            break;

                        case 'answer_done':
                            answerCompleted = true;
                            sourcesData = event.sources || sourcesData;
                            assistantMessageId = event.message_id || assistantMessageId;
                            newConvId = event.conversation_id || newConvId;
                            if (newConvId) currentConvId = newConvId;
                            if (event.reasoning_content) {
                                reasoningContent = event.reasoning_content;
                            }
                            renderCurrentBubble();
                            break;

                        case 'done':
                            receivedDone = true;
                            answerCompleted = true;
                            sourcesData = event.sources || sourcesData;
                            assistantMessageId = event.message_id || assistantMessageId;
                            newConvId = event.conversation_id;
                            currentConvId = newConvId;
                            if (event.reasoning_content) {
                                reasoningContent = event.reasoning_content;
                            }
                            renderCurrentBubble();
                            break;

                        case 'warning':
                            _lastWarningMsg = event.message || '';
                            showWarningBanner(_lastWarningMsg);
                            break;
                    }
                } catch (e) {
                    // skip malformed events
                }
            }
        }

        // 流正常结束但没收到 done 事件（连接意外中断）
        if (!receivedDone) {
            if (!fullContent) {
                bubble.innerHTML = '<p style="color:#e53e3e;">抱歉，连接意外中断，请重试。</p>';
            } else if (answerCompleted) {
                renderSourcesIntoBubble(bubble, sourcesData);
            }
        }
    } catch (err) {
        if (err.name === 'AbortError') {
            bubble.innerHTML = '<p style="color:#e53e3e;">请求已被取消。</p>';
        } else {
            bubble.innerHTML = '<p style="color:#e53e3e;">抱歉，请求出错了，请重试。</p>';
        }
        console.error('Stream error:', err);
    }

    document.getElementById('chatTitle').textContent = query.substring(0, 50);
    await loadConversations();

    isLoading = false;
    document.getElementById('sendBtn').disabled = false;
    document.getElementById('statusText').textContent = '就绪';
    scrollToBottom();
}

async function submitGenerationClarification(button, query, mode) {
    const bubble = button.closest('.message-bubble');
    const fields = {};
    bubble.querySelectorAll('[data-generation-field]').forEach(input => {
        fields[input.dataset.generationField] = input.value.trim();
    });

    button.textContent = '正在生成提纲...';
    try {
        const response = await fetch('/api/generation/route', {
            method: 'POST', headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({query, fields}),
        });
        const data = await response.json();

            button.disabled = false;

        scrollToBottom();
    } catch (error) {
        button.disabled = false;
        button.textContent = '生成提纲';
        alert(error.message || '提纲生成失败');

}

const generationDrafts = {};

function appendGenerationOutline(generation) {
    const container = document.getElementById('chatMessages');
    const outline = generation.outline || {};
    const isPpt = generation.mode === 'presentation';
    const references = generation.references || [];
    generationDrafts[generation.id] = {
        mode: generation.mode,
        fields: outline.fields || generation.fields || {},
        title: outline.title || '',
    };
    const entries = isPpt
        ? (outline.pages || []).map(page => `<li>第 ${page.page} 页：${escapeHtml(page.title || '')}</li>`).join('')
        : (outline.sections || []).map(section => `<li>${escapeHtml(section.heading || '')}</li>`).join('');
    const div = document.createElement('div');
    div.className = 'message assistant';
    const referenceHtml = references.length
        ? `<div style="margin-top:8px;font-size:12px;color:#555"><strong>已检索授权资料：</strong><ul>${references.map(reference => `<li>${escapeHtml(reference.source_name || '未命名资料')}${reference.section ? ` / ${escapeHtml(reference.section)}` : ''}</li>`).join('')}</ul></div>`
        : `<p style="font-size:12px;color:#a15c00;margin-top:8px"><strong>引用状态：</strong>未找到可绑定的授权资料，法规、标准和组织事实均需人工核验。</p>`;
    div.innerHTML = `<div class="message-role">助手</div><div class="message-bubble"><strong>已生成${isPpt ? ' PPT' : ' Word 文档'}提纲：${escapeHtml(outline.title || '')}</strong><ul>${entries}</ul>${referenceHtml}<p style="font-size:12px;color:#666">请确认提纲与适用范围；确认后生成本地 ${isPpt ? '.pptx PPT' : '.docx Word'} 文件。法规和组织事实仍需依据授权资料复核。</p><button class="account-btn" onclick="editGenerationOutline('${generation.id}', this)">编辑提纲</button><button class="account-btn" style="margin-left:8px" onclick="renderGenerationArtifact('${generation.id}', this)">确认并生成 ${isPpt ? 'PPT' : 'Word'}</button></div>`;
    container.appendChild(div);
}

function editGenerationOutline(generationId, button) {
    const bubble = button.closest('.message-bubble');
    const list = bubble.querySelector('ul');
    if (!list) return;
    const current = Array.from(list.querySelectorAll('li')).map(item => item.textContent).join('\n');
    const revised = window.prompt('每行一项。文档填写章节标题；PPT 可填写“第 N 页：标题”。', current);
    if (revised === null) return;
    const entries = revised.split('\n').map(value => value.trim()).filter(Boolean);
    if (!entries.length) { alert('至少保留一项提纲内容'); return; }
    button.disabled = true;
    button.textContent = '保存中...';
    const draft = generationDrafts[generationId] || {};
    const isPpt = draft.mode === 'presentation';
    const title = draft.title || (bubble.querySelector('strong')?.textContent || '').split('：').slice(1).join('：') || '网络安全交付物';
    const outline = isPpt
        ? {title, mode: 'presentation', fields: draft.fields || {}, pages: entries.map((value, index) => ({page: index + 1, title: value.replace(/^第\s*\d+\s*页[：:]\s*/, ''), points: ['待结合授权资料补充证据与数据']}))}
        : {title, mode: 'writing', fields: draft.fields || {}, sections: entries.map(value => ({heading: value, points: ['待结合授权资料补充可核验要求']}))};
    fetch(`/api/generation/requests/${generationId}/outline`, {
        method: 'PUT', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({outline}),
    }).then(async response => {
        const data = await response.json();
        if (!response.ok) throw new Error(data.detail || '提纲保存失败');
        const updated = data.generation || {};
        const updatedOutline = updated.outline || outline;
        generationDrafts[generationId] = {
            mode: updated.mode || draft.mode,
            fields: updatedOutline.fields || draft.fields || {},
            title: updatedOutline.title || title,
        };
        const lines = updated.mode === 'presentation'
            ? (updatedOutline.pages || []).map(page => `<li>第 ${page.page} 页：${escapeHtml(page.title || '')}</li>`).join('')
            : (updatedOutline.sections || []).map(section => `<li>${escapeHtml(section.heading || '')}</li>`).join('');
        list.innerHTML = lines;
        button.disabled = false;
        button.textContent = '编辑提纲';
    }).catch(error => {
        button.disabled = false;
        button.textContent = '编辑提纲';
        alert(error.message || '提纲保存失败');
    });
}

async function renderGenerationArtifact(generationId, button) {
    button.disabled = true;
    button.textContent = '生成中...';
    try {
        const response = await fetch(`/api/generation/requests/${generationId}/render`, {method: 'POST'});
        const data = await response.json();
        if (!response.ok) throw new Error(data.detail || '生成失败');
        const link = document.createElement('a');
        link.href = `/api/generation/requests/${generationId}/download`;
        const draft = generationDrafts[generationId] || {};
        link.textContent = `下载 ${draft.mode === 'presentation' ? 'PPT' : 'Word'} 文件`;
        link.title = link.textContent;
        link.className = 'account-btn';
        link.style.marginLeft = '8px';
        button.replaceWith(link);
    } catch (error) {
        button.disabled = false;
        const draft = generationDrafts[generationId] || {};
        button.textContent = `确认并生成 ${draft.mode === 'presentation' ? 'PPT' : 'Word'}`;
        alert(error.message || '生成失败');
    }
}

// ===== 简单 Markdown 渲染 =====
function formatContent(text) {
    if (!text) return '';
    let html = escapeHtml(text);
    // 代码块
    html = html.replace(/```(\w*)\n([\s\S]*?)```/g, '<pre><code class="language-$1">$2</code></pre>');
    // 行内代码
    html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
    // 加粗
    html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
    // 无序列表
    html = html.replace(/^- (.+)$/gm, '<li>$1</li>');
    html = html.replace(/(<li>.*<\/li>\n?)+/g, '<ul>$&</ul>');
    // 换行
    html = html.replace(/\n/g, '<br>');
    return html;
}

function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}

function renderSourcesHtml(sources) {
    if (!sources || sources.length === 0) return '';
    const items = sources.map(s => {
        const label = s.label
            ? `<span class="conf-label conf-${s.label}" title="置信度: ${s.confidence}">${s.label}</span>`
            : '';
        return `<div class="source-item">
            <span class="source-cat">${escapeHtml(s.category || '')}</span>
            <span class="source-file">${escapeHtml(s.display_name || s.file_name || '')} / ${escapeHtml(s.section || '')}</span>
            ${label}
            <span class="source-score">${s.confidence != null ? Number(s.confidence).toFixed(2) : ''}</span>
        </div>`;
    }).join('');
    return `<details class="message-sources">
        <summary>📎 ${sources.length} 篇参考文档</summary>
        ${items}
    </details>`;
}

function renderSourcesIntoBubble(bubble, sources) {
    if (!bubble || !sources || sources.length === 0 || bubble.querySelector('.message-sources')) return;
    bubble.insertAdjacentHTML('beforeend', renderSourcesHtml(sources));
    scrollToBottom();
}

function renderReasoning(text) {
    if (!text) return '';
    return `<details class="reasoning-box" open>
        <summary>🧠 模型推理过程</summary>
        <div class="reasoning-content">${escapeHtml(text)}</div>
    </details>`;
}

function scrollToBottom() {
    const container = document.getElementById('chatMessages');
    requestAnimationFrame(() => {
        container.scrollTop = container.scrollHeight;
    });
}

// ===== 5 星评分组件 =====
function appendRating(bubble, messageId) {
    if (!bubble || bubble.querySelector('.rating-bar')) return;
    const bar = document.createElement('div');
    bar.className = 'rating-bar';
    // 历史对话场景：locked 参数可预设已记录评分，避免重新触发兜底定时器
    const locked = _ratedMessages[messageId] || (appendRating._lockedOverride && appendRating._lockedOverride[messageId]);
    let starsHtml = '';
    for (let i = 1; i <= 5; i++) {
        const active = locked && i <= locked ? ' active' : '';
        const style = locked && i <= locked ? ' style="color:#ff9500;cursor:default"' : '';
        const handlers = locked ? '' : `onclick="submitRating(this, ${messageId}, ${i})" onmouseover="hoverStar(this,${i})" onmouseout="resetStars(this)"`;
        starsHtml += `<svg class="rating-star${active}" data-val="${i}" viewBox="0 0 24 24" ${handlers}${style}>
            <path fill="currentColor" d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>
        </svg>`;
    }
    const labels = ['', '不满意', '不太满意', '一般', '满意', '非常满意'];
    const labelHtml = locked
        ? `<span class="rating-locked">⭐ ${labels[locked] || locked}</span>`
        : '<span class="rating-label">评价回答质量</span>';
    bar.innerHTML = starsHtml + labelHtml;
    bubble.appendChild(bar);
    if (!locked) scheduleSemanticFallbackRating(messageId);
}

function scheduleSemanticFallbackRating(messageId) {
    if (!messageId || _ratingTimers[messageId]) return;
    _ratingTimers[messageId] = setTimeout(() => {
        fetch('/api/rating/semantic-fallback', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({message_id: messageId}),
        }).catch(e => console.debug('语义评分兜底提交失败:', e))
          .finally(() => { delete _ratingTimers[messageId]; });
    }, 30000);
}

function hoverStar(el, val) {
    const bar = el.parentElement;
    const stars = bar.querySelectorAll('.rating-star');
    stars.forEach((s, i) => {
        s.style.color = i < val ? '#ff9500' : '#ddd';
    });
}

function resetStars(el) {
    const bar = el.parentElement;
    const stars = bar.querySelectorAll('.rating-star');
    stars.forEach(s => {
        if (!s.classList.contains('active')) s.style.color = '#ddd';
    });
}

function submitRating(el, messageId, rating) {
    _ratedMessages[messageId] = rating;
    if (_ratingTimers[messageId]) {
        clearTimeout(_ratingTimers[messageId]);
        delete _ratingTimers[messageId];
    }
    const bar = el.parentElement;
    const stars = bar.querySelectorAll('.rating-star');
    stars.forEach((s, i) => {
        s.style.color = i < rating ? '#ff9500' : '#ddd';
        s.classList.toggle('active', i < rating);
        s.onclick = null;
        s.onmouseover = null;
        s.onmouseout = null;
        s.style.cursor = 'default';
    });
    const label = bar.querySelector('.rating-label');
    const labels = ['', '不满意', '不太满意', '一般', '满意', '非常满意'];
    label.textContent = `⭐ ${labels[rating] || rating}`;
    label.className = 'rating-locked';

    fetch('/api/rating', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({message_id: messageId, rating}),
    }).catch(e => console.error('评分提交失败:', e));
}

// ===== 键盘事件 =====
document.getElementById('chatInput').addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
    }
});

document.getElementById('chatInput').addEventListener('input', function() {
    this.style.height = 'auto';
    this.style.height = Math.min(this.scrollHeight, 120) + 'px';
});

// ===== 启动 =====
init();
</script>
</body>
</html>
