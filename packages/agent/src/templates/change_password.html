<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>修改密码 | 安枢 SecureNexus</title>
<style>
  *{box-sizing:border-box}body{margin:0;padding:24px;min-height:100vh;display:grid;place-items:center;background:#f4f6f8;color:#172033;font:16px system-ui,sans-serif}
  main{width:100%;max-width:420px}h1{font-size:24px}p{line-height:1.6}label{display:block;margin-top:18px}input,button{width:100%;min-height:44px;margin-top:7px;padding:10px;font:inherit;border:1px solid #64748b;border-radius:4px}
  button{margin-top:22px;background:#1463b8;color:white;border:0;cursor:pointer}button:disabled{opacity:.6}input:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid #1463b8;outline-offset:3px}
  #error{min-height:24px;color:#b42318;overflow-wrap:anywhere}
</style>
<main>
  <h1>请设置新密码</h1>
  <p>密码重置后，需要先修改密码才能继续使用安枢。新密码至少8位，包含大写字母、小写字母和数字。</p>
  <form id="changeForm">
    <label for="current">当前密码（重置后的临时密码）</label>
    <input id="current" type="password" autocomplete="current-password" required>
    <label for="new">新密码</label>
    <input id="new" type="password" autocomplete="new-password" minlength="8" required>
    <label for="confirm">再次输入新密码</label>
    <input id="confirm" type="password" autocomplete="new-password" minlength="8" required>
    <p id="error" role="alert" aria-live="polite"></p>
    <button id="submit" type="submit">保存新密码</button>
  </form>
  <p><a id="back" href="/login">返回登录</a></p>
</main>
<script>
const admin = new URLSearchParams(location.search).get('admin') === '1';
const login = admin ? '/admin/login' : '/login';
document.getElementById('back').href = login;
document.getElementById('changeForm').addEventListener('submit', async event => {
  event.preventDefault();
  const current_password = document.getElementById('current').value;
  const new_password = document.getElementById('new').value;
  const password_confirm = document.getElementById('confirm').value;
  const error = document.getElementById('error'), button = document.getElementById('submit');
  error.textContent = '';
  if (new_password !== password_confirm) { error.textContent = '两次输入的新密码不一致'; return; }
  if (!/[A-Z]/.test(new_password) || !/[a-z]/.test(new_password) || !/[0-9]/.test(new_password)) {
    error.textContent = '新密码需包含大小写字母和数字'; return;
  }
  button.disabled = true;
  try {
    const response = await fetch('/api/auth/password', {
      method:'POST', credentials:'same-origin',
      headers:{'Content-Type':'application/json', ...(admin ? {'X-Admin-Context':'1'} : {})},
      body:JSON.stringify({current_password, new_password, password_confirm})
    });
    const result = await response.json();
    if (!response.ok) throw new Error(result.detail || '修改失败，请重试');
    window.alert('密码已修改，请使用新密码重新登录。');
    location.replace(login);
  } catch (failure) { error.textContent = failure.message; }
  finally { button.disabled = false; }
});
</script>
</html>
