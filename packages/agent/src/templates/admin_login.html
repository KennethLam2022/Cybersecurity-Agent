<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>管理员登录 | 安枢 SecureNexus</title>
  <style>
    :root{--ink:#172033;--muted:#64748b;--line:#dce4ee;--blue:#1463b8;--blue-dark:#0d4e93;--paper:#fff;--canvas:#f3f6fa;--danger:#b42318;--focus:#0f6cbd}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--canvas);color:var(--ink);font-family:"Segoe UI","Microsoft YaHei",sans-serif;display:grid;place-items:center;padding:24px}
    .shell{width:min(820px,100%);display:grid;grid-template-columns:1fr 1fr;background:var(--paper);border:1px solid var(--line);border-radius:8px;overflow:hidden;box-shadow:0 18px 52px rgba(15,42,77,.12)}
    .identity{padding:46px;background:#173b65;color:#fff;display:flex;flex-direction:column;justify-content:space-between;min-height:440px}.brand{font-size:28px;font-weight:700}.brand span{font-size:14px;font-weight:500;opacity:.86;margin-left:7px}.tagline{font-size:17px;line-height:1.65;max-width:290px;margin:18px 0 auto;color:#d9e7f5}.identity small{font-size:12px;line-height:1.55;color:#b9d2ea}
    .form{padding:42px 40px}.form h1{font-size:23px;margin:0 0 8px}.lead{font-size:13px;color:var(--muted);margin:0 0 26px;line-height:1.55}.scope{font-size:12px;color:#334155;background:#eef5fc;border-left:3px solid var(--blue);padding:9px 10px;margin-bottom:20px;line-height:1.5}
    label{display:block;font-size:12px;font-weight:600;color:#334155;margin:15px 0 6px}input{width:100%;border:1px solid #bcc8d6;border-radius:5px;padding:11px 12px;font:14px inherit;color:var(--ink);outline:none}input:focus{border-color:var(--focus);box-shadow:0 0 0 3px rgba(15,108,189,.14)}.error{min-height:20px;color:var(--danger);font-size:12px;margin-top:7px;line-height:1.45}.submit{width:100%;margin-top:22px;border:0;border-radius:5px;background:var(--blue);color:#fff;padding:12px;font:600 14px inherit;cursor:pointer}.submit:hover{background:var(--blue-dark)}.submit:disabled{opacity:.6;cursor:wait}.back{display:inline-block;margin-top:20px;font-size:12px;color:var(--blue);text-decoration:none}
    @media(max-width:720px){body{padding:0;place-items:stretch}.shell{border:0;border-radius:0;grid-template-columns:1fr;box-shadow:none}.identity{min-height:180px;padding:28px}.tagline{margin:12px 0 0}.identity small{display:none}.form{padding:32px 24px}}
  </style>
</head>
<body>
  <main class="shell" aria-labelledby="adminLoginTitle">
    <section class="identity"><div><div class="brand">安枢 <span>SecureNexus</span></div><p class="tagline">连接安全知识，驱动可信行动。</p></div><small>管理员控制台 · 组织、知识、配置与质量评测</small></section>
    <section class="form">
      <h1 id="adminLoginTitle">管理员登录</h1>
      <p class="lead">使用平台管理员或组织管理员账号进入管理后台。</p>
      <div class="scope">此入口只接受管理员身份。普通用户请从前台登录。</div>
      <form id="adminLoginForm">
        <label for="email">管理员邮箱</label>
        <input id="email" type="email" autocomplete="username" required>
        <label for="password">密码</label>
        <input id="password" type="password" autocomplete="current-password" required>
        <div id="error" class="error" role="alert" aria-live="polite"></div>
        <button class="submit" id="submitButton" type="submit">进入管理后台</button>
      </form>
      <a class="back" href="/login">返回前台登录</a>
    </section>
  </main>
  <script>
    const nextPath=(()=>{const value=new URLSearchParams(location.search).get('next')||'/admin';return value.startsWith('/admin')&&!value.startsWith('//')?value:'/admin'})();
    const form=document.getElementById('adminLoginForm'),button=document.getElementById('submitButton'),error=document.getElementById('error');
    form.addEventListener('submit',async event=>{event.preventDefault();button.disabled=true;error.textContent='正在验证管理员身份...';try{const response=await fetch('/api/auth/admin-login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:document.getElementById('email').value.trim(),password:document.getElementById('password').value})});const data=await response.json();if(!response.ok)throw new Error(data.detail||'管理员邮箱或密码错误');location.replace(nextPath)}catch(exc){error.textContent=exc.message||'管理员邮箱或密码错误'}finally{button.disabled=false}});
  </script>
</body>
</html>
