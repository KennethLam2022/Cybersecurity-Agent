<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>安枢 SecureNexus · 对话分享</title>
<style>
  :root{--bg:#f5f5f7;--card:#fff;--t:#1d1d1f;--t2:#6e6e73;--b:#e5e5ea;--a:#0071e3;--u:#edf6ff;--f:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif}
  *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font-family:var(--f)}main{width:min(900px,100%);margin:0 auto;padding:32px 18px}.brand{font-size:15px;font-weight:700}.brand span{font-size:12px;color:var(--t2);font-weight:500}.sub{font-size:12px;color:var(--t2);margin-top:5px}.card{margin-top:20px;background:var(--card);border:1px solid var(--b);border-radius:8px;padding:20px}.password{max-width:360px}.password input{width:100%;padding:9px;border:1px solid var(--b);border-radius:6px;font:13px var(--f);margin:10px 0}.password button{padding:8px 12px;border:0;border-radius:6px;background:var(--a);color:#fff;font:600 12px var(--f);cursor:pointer}.status{font-size:12px;color:#c62828;margin-top:10px;min-height:18px}.title{font-size:20px;margin:0 0 5px}.meta{font-size:12px;color:var(--t2);padding-bottom:16px;border-bottom:1px solid var(--b)}.msg{margin-top:14px;border:1px solid var(--b);border-radius:8px;padding:12px;line-height:1.65;white-space:pre-wrap;word-break:break-word}.msg.user{background:var(--u)}.role{font-size:11px;color:var(--t2);font-weight:600;margin-bottom:7px}.no-copy{user-select:none}.no-copy .msg{-webkit-user-select:none;user-select:none}
</style>
</head>
<body>
<main id="app">
  <div class="brand">安枢 <span>SecureNexus</span></div>
  <div class="sub">只读对话分享</div>
  <section class="card" id="content"><div class="sub">正在验证分享链接...</div></section>
</main>
<script>
const token = location.pathname.split('/').filter(Boolean).pop() || '';
const content = document.getElementById('content');
function esc(v){return String(v ?? '').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
async function load(password=''){
  const response=await fetch('/api/shared/conversations/'+encodeURIComponent(token),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password})});
  const data=await response.json().catch(()=>({}));
  if(response.status===401){renderPassword(data.detail||'该分享需要密码');return;}
  if(!response.ok){content.innerHTML='<div class="status">'+esc(data.detail||'分享链接无效、已撤销或已过期')+'</div>';return;}
  const conversation=data.conversation||{},share=data.share||{};
  document.title=(conversation.title||'对话分享')+' · 安枢';
  const copyClass=share.allow_copy?'':' no-copy';
  content.className='card'+copyClass;
  content.innerHTML='<h1 class="title">'+esc(conversation.title||'对话分享')+'</h1><div class="meta">只读分享 · 有效至 '+esc(share.expires_at||'--')+(share.allow_copy?'':' · 已关闭页面内复制')+'</div>'+((conversation.messages||[]).map(m=>'<article class="msg '+(m.role==='user'?'user':'assistant')+'"><div class="role">'+(m.role==='user'?'用户提问':'Agent 回答')+'</div>'+esc(m.content||'')+'</article>').join('')||'<div class="sub">暂无消息</div>');
  if(!share.allow_copy){document.addEventListener('copy',e=>e.preventDefault());document.addEventListener('contextmenu',e=>e.preventDefault());}
}
function renderPassword(message){content.className='card password';content.innerHTML='<div>请输入分享密码</div><input id="password" type="password" autocomplete="current-password"><button id="unlock">打开分享</button><div class="status">'+esc(message)+'</div>';document.getElementById('unlock').onclick=()=>load(document.getElementById('password').value);document.getElementById('password').focus();}
load();
</script>
</body>
</html>
