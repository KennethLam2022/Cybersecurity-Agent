<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>安枢 · 知识库治理</title>
  <style>
    :root{--bg:#f6f7f9;--panel:#fff;--ink:#1f2937;--muted:#667085;--line:#d9dee7;--blue:#2369a8;--red:#b42318;--green:#16794c}
    *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.55 "Microsoft YaHei",Arial,sans-serif}
    .wrap{max-width:1240px;margin:0 auto;padding:28px 22px 48px}.head{display:flex;justify-content:space-between;gap:18px;align-items:flex-start;margin-bottom:20px}
    h1{font-size:24px;margin:0 0 4px;color:#163a5f}.sub{color:var(--muted);margin:0}.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
    button,input,select{font:inherit;border:1px solid var(--line);border-radius:5px;background:#fff;padding:8px 10px}button{cursor:pointer;color:var(--ink)}button.primary{background:var(--blue);border-color:var(--blue);color:#fff}button.danger{color:var(--red)}
    .grid{display:grid;grid-template-columns:minmax(360px,0.9fr) minmax(540px,1.6fr);gap:16px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:16px}.panel h2{font-size:16px;margin:0 0 12px;color:#163a5f}
    table{width:100%;border-collapse:collapse}th,td{border-bottom:1px solid #edf0f4;text-align:left;padding:9px 7px;vertical-align:top}th{font-size:12px;color:var(--muted);font-weight:600}td{font-size:13px}.row{cursor:pointer}.row:hover{background:#f7fafc}.row.active{background:#eef6fd}
    .pill{display:inline-block;padding:2px 7px;border-radius:12px;background:#eef2f6;color:#526071;font-size:11px}.pill.active,.pill.published{color:var(--green);background:#e8f6ef}.pill.review{color:#8a5a00;background:#fff5d8}.pill.archived{color:#7b2d2d;background:#fcebea}
    .form{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}.form input,.form select{width:100%}.form .wide{grid-column:1/-1}.empty{color:var(--muted);padding:22px 4px;text-align:center}.muted{color:var(--muted);font-size:12px}.actions{display:flex;gap:6px;flex-wrap:wrap}.detail-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.detail-head h3{margin:0;font-size:18px}.section{margin-top:18px}.section h3{font-size:14px;color:#344054;margin:0 0 8px}.split{display:grid;grid-template-columns:1fr 1fr;gap:12px}.msg{min-height:22px;color:var(--muted);margin:8px 0}.msg.error{color:var(--red)}
    @media(max-width:860px){.grid{grid-template-columns:1fr}.split{grid-template-columns:1fr}.head{display:block}.head .toolbar{margin-top:12px}.form{grid-template-columns:1fr}}
  </style>
</head>
<body>
<main class="wrap">
  <select data-page-language aria-label="Language" style="float:right"><option value="zh-CN">中文</option><option value="en-US">English</option></select>
  <header class="head">
    <div><h1 data-i18n="知识库治理">知识库治理</h1><p class="sub" data-i18n="管理知识库归属、文档生命周期、版本和入库结果。权限与审核状态独立于向量索引。">管理知识库归属、文档生命周期、版本和入库结果。权限与审核状态独立于向量索引。</p></div>
    <div class="toolbar"><input id="tenant" placeholder="工作区 ID（可选）"><button onclick="loadKbs()">刷新</button><button onclick="scanExpiredDocuments()">检查过期</button></div>
  </header>
  <div class="grid">
    <section class="panel">
      <h2 data-i18n="知识库">知识库</h2>
      <form class="form" onsubmit="createKb(event)">
        <input id="kbName" placeholder="知识库名称" required>
        <select id="kbVisibility"><option value="tenant">工作区共享</option><option value="public">公共</option><option value="private">私有</option></select>
        <input id="kbProfile" placeholder="Profile，例如 general" value="general">
        <input id="kbOwner" placeholder="所有者用户 ID（可选）">
        <input class="wide" id="kbDescription" placeholder="用途说明（可选）">
        <button class="primary wide" type="submit">创建知识库</button>
      </form>
      <div id="kbMsg" class="msg"></div>
      <div id="kbList" class="empty">加载中...</div>
    </section>
    <section class="panel">
      <div id="detail" class="empty">选择左侧知识库查看文档</div>
    </section>
  </div>
  <section class="panel" style="margin-top:16px">
    <h2 data-i18n="数据源登记">数据源登记</h2>
    <p class="muted">数据源只登记来源和同步策略；抓取内容必须经过解析、审核后才进入知识库。</p>
    <form class="form" onsubmit="createSource(event)">
      <input id="sourceName" placeholder="数据源名称" required>
      <select id="sourceType" onchange="sourceTypeChanged()"><option value="url">URL</option><option value="web_directory">网页目录</option><option value="database_readonly">只读数据库</option><option value="local_upload">本地上传目录</option><option value="excel_csv">Excel/CSV</option></select>
      <input class="wide" id="sourceEndpoint" placeholder="地址、目录或连接标识" required>
      <input id="sourceKb" placeholder="知识库 ID（可选）">
      <select id="sourceMode"><option value="manual">手动同步</option><option value="scheduled">定时同步</option></select>
      <input id="sourceSchedule" placeholder="Cron，例如 0 3 * * *">
      <input id="sourceConfig" class="wide" placeholder='高级配置 JSON，例如 {"timeout_seconds":15}'>
      <button class="primary wide" type="submit">登记数据源</button>
    </form>
    <div id="sourceMsg" class="msg"></div>
    <div id="sourceList" class="empty">加载中...</div>
  </section>
</main>
<script>
  const esc = (v) => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const headers = () => { const csrf = (document.cookie.match(/(?:^|; )securenexus_csrf=([^;]+)/) || [])[1]; return csrf ? {'X-CSRF-Token': decodeURIComponent(csrf)} : {}; };
  let selected = null;
  async function api(url, options={}) {
    options.headers = {...headers(), ...(options.headers || {})};
    const r = await fetch(url, options); const data = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(data.detail || '请求失败'); return data;
  }
  function showMsg(text, error=false){const el=document.getElementById('kbMsg');el.textContent=text||'';el.className='msg'+(error?' error':'')}
  async function loadKbs(){
    try { const tenant=encodeURIComponent(document.getElementById('tenant').value.trim()); const data=await api('/api/admin/knowledge-bases'+(tenant?'?tenant_id='+tenant:''));
      const items=data.items||[]; document.getElementById('kbList').innerHTML=items.length?`<table><thead><tr><th>名称</th><th>Profile</th><th>状态</th><th>文档</th></tr></thead><tbody>${items.map(k=>`<tr class="row ${selected===k.id?'active':''}" onclick="selectKb('${esc(k.id)}')"><td><strong>${esc(k.name)}</strong><div class="muted">${esc(k.description)}</div></td><td>${esc(k.profile)}</td><td><span class="pill ${esc(k.status)}">${esc(k.status)}</span></td><td>${k.document_count||0}</td></tr>`).join('')}</tbody></table>`:'<div class="empty">暂无知识库</div>';
    } catch(e){document.getElementById('kbList').innerHTML='<div class="empty">加载失败</div>';showMsg(e.message,true)}
  }
  async function createKb(e){e.preventDefault();try{await api('/api/admin/knowledge-bases',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({tenant_id:document.getElementById('tenant').value.trim()||'local-default',name:document.getElementById('kbName').value,description:document.getElementById('kbDescription').value,profile:document.getElementById('kbProfile').value,visibility:document.getElementById('kbVisibility').value,owner_user_id:document.getElementById('kbOwner').value})});e.target.reset();document.getElementById('kbProfile').value='general';showMsg('知识库已创建');loadKbs()}catch(err){showMsg(err.message,true)}}
  async function selectKb(id){selected=id;loadKbs();try{const tenant=encodeURIComponent(document.getElementById('tenant').value.trim());const data=await api('/api/admin/knowledge-bases/'+encodeURIComponent(id)+'/documents'+(tenant?'?tenant_id='+tenant:''));const kb=(await api('/api/admin/knowledge-bases?include_archived=true')).items.find(x=>x.id===id);document.getElementById('detail').innerHTML=`<div class="detail-head"><div><h3>${esc(kb?.name||id)}</h3><div class="muted">${esc(kb?.description||'')}</div></div><div class="actions"><button onclick="setKbStatus('${esc(id)}','disabled')">停用</button><button class="danger" onclick="setKbStatus('${esc(id)}','archived')">归档</button></div></div><div class="section"><h3>文档（${(data.items||[]).length}）</h3>${(data.items||[]).length?`<table><thead><tr><th>来源</th><th>Profile</th><th>技术状态</th><th>审核状态</th><th>版本</th><th>操作</th></tr></thead><tbody>${data.items.map(d=>`<tr><td>${esc(d.source_name)}<div class="muted">${esc(d.id)}</div></td><td>${esc(d.profile)}</td><td>${esc(d.status)}</td><td><span class="pill ${esc(d.lifecycle_status)}">${esc(d.lifecycle_status)}</span></td><td>${d.version||1}</td><td class="actions"><button onclick="setDocStatus('${esc(d.id)}','published')">发布</button>${d.status!=='indexed'?`<button onclick="retryDoc('${esc(d.id)}')">重试入库</button>`:''}<button onclick="setDocStatus('${esc(d.id)}','archived')">归档</button><button onclick="showVersions('${esc(d.id)}')">版本</button></td></tr>`).join('')}</tbody></table>`:'<div class="empty">该知识库暂无文档</div>'}</div><div id="retrievalConfig" class="section"></div><div id="versions" class="section"></div><div id="grants" class="section"></div>`;loadRetrievalConfig(id);loadGrants(id)}catch(e){document.getElementById('detail').innerHTML='<div class="empty">加载失败</div>';showMsg(e.message,true)}}
  async function setKbStatus(id,status){try{await api('/api/admin/knowledge-bases/'+encodeURIComponent(id)+'/status',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({status,tenant_id:document.getElementById('tenant').value.trim()||undefined})});showMsg('知识库状态已更新');loadKbs();selectKb(id)}catch(e){showMsg(e.message,true)}}
  async function setDocStatus(id,status){try{await api('/api/admin/documents/'+encodeURIComponent(id)+'/lifecycle',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({lifecycle_status:status,tenant_id:document.getElementById('tenant').value.trim()||undefined,changed_by:'admin',change_reason:'后台治理页面操作'})});showMsg('文档生命周期已更新');selectKb(selected)}catch(e){showMsg(e.message,true)}}
  async function retryDoc(id){try{await api('/api/admin/documents/'+encodeURIComponent(id)+'/retry-ingestion',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({tenant_id:document.getElementById('tenant').value.trim()||undefined,changed_by:'admin'})});showMsg('文档重试入库已启动');setTimeout(()=>selectKb(selected),800)}catch(e){showMsg(e.message,true)}}
  async function scanExpiredDocuments(){try{const tenant=document.getElementById('tenant').value.trim();const d=await api('/api/admin/documents/expire',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({tenant_id:tenant||undefined})});showMsg(`过期检查完成：${d.expired_count||0} 个文档已标记为过期`);if(selected)selectKb(selected)}catch(e){showMsg(e.message,true)}}
  async function loadRetrievalConfig(id){try{const tenant=encodeURIComponent(document.getElementById('tenant').value.trim());const d=await api('/api/admin/knowledge-bases/'+encodeURIComponent(id)+'/retrieval-config'+(tenant?'?tenant_id='+tenant:''));const c=d.config||{};document.getElementById('retrievalConfig').innerHTML=`<h3>检索配置（v${d.version||0}）</h3><div class="muted">即时参数会影响运行时；切片大小/重叠变更后需要定向重建。${c.rebuild_required?' 当前配置待重建。':''}</div><form class="form" onsubmit="saveRetrievalConfig(event,'${esc(id)}')"><input id="retTopK" type="number" min="1" max="50" value="${c.top_k||10}" placeholder="TopK"><input id="retRrfK" type="number" min="1" max="200" value="${c.rrf_k||60}" placeholder="RRF K"><input id="retChunkSize" type="number" min="100" max="2000" value="${c.chunk_size||300}" placeholder="切片大小"><input id="retOverlap" type="number" min="0" max="500" value="${c.chunk_overlap||50}" placeholder="切片重叠"><select id="retRerank"><option value="true" ${c.use_rerank?'selected':''}>启用 Rerank</option><option value="false" ${!c.use_rerank?'selected':''}>关闭 Rerank</option></select><select id="retHybrid"><option value="true" ${c.use_hybrid?'selected':''}>启用混合检索</option><option value="false" ${!c.use_hybrid?'selected':''}>关闭混合检索</option></select><input class="wide" id="retReason" placeholder="变更原因"><button class="primary wide" type="submit">保存检索配置</button></form>`}catch(e){document.getElementById('retrievalConfig').innerHTML='<h3>检索配置</h3><div class="empty">加载失败</div>'}}
  async function saveRetrievalConfig(e,id){e.preventDefault();try{const body={tenant_id:document.getElementById('tenant').value.trim()||undefined,changed_by:'admin',change_reason:document.getElementById('retReason').value,config:{top_k:Number(document.getElementById('retTopK').value),rrf_k:Number(document.getElementById('retRrfK').value),chunk_size:Number(document.getElementById('retChunkSize').value),chunk_overlap:Number(document.getElementById('retOverlap').value),use_rerank:document.getElementById('retRerank').value==='true',use_hybrid:document.getElementById('retHybrid').value==='true'}};const d=await api('/api/admin/knowledge-bases/'+encodeURIComponent(id)+'/retrieval-config',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});showMsg(d.config?.rebuild_required?'已保存，切片参数变更需要定向重建':'检索配置已保存');loadRetrievalConfig(id)}catch(e){showMsg(e.message,true)}}
  async function showVersions(id){try{const tenant=encodeURIComponent(document.getElementById('tenant').value.trim());const data=await api('/api/admin/documents/'+encodeURIComponent(id)+'/versions'+(tenant?'?tenant_id='+tenant:''));document.getElementById('versions').innerHTML=`<h3>版本记录</h3>${(data.items||[]).length?`<table><thead><tr><th>版本</th><th>状态</th><th>变更原因</th><th>创建者</th><th>时间</th><th>操作</th></tr></thead><tbody>${data.items.map(v=>`<tr><td>v${v.version}</td><td>${esc(v.lifecycle_status)}</td><td>${esc(v.change_reason)}</td><td>${esc(v.created_by)}</td><td>${esc(v.created_at)}</td><td><button onclick="rollbackDocVersion('${esc(id)}',${v.version})">回滚为新版本</button></td></tr>`).join('')}</tbody></table>`:'<div class="empty">暂无版本记录</div>'}`}catch(e){showMsg(e.message,true)}}
  async function rollbackDocVersion(id,version){if(!confirm('回滚会生成新的文档版本，并需要重新索引。继续吗？'))return;try{const tenant=document.getElementById('tenant').value.trim();const d=await api('/api/admin/documents/'+encodeURIComponent(id)+'/versions/'+version+'/rollback',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({tenant_id:tenant||undefined,change_reason:'管理员版本回滚'})});showMsg(d.rebuild_required?'回滚完成，已标记为待重新索引':'回滚完成');selectKb(selected)}catch(e){showMsg(e.message,true)}}
  async function loadGrants(id){try{const tenant=encodeURIComponent(document.getElementById('tenant').value.trim());const d=await api('/api/admin/knowledge-bases/'+encodeURIComponent(id)+'/grants'+(tenant?'?tenant_id='+tenant:''));document.getElementById('grants').innerHTML=`<h3>知识库访问授权</h3><div class="muted">工作区知识库默认共享；配置显式授权后仅匹配的用户或 Agent 可访问。</div><form class="form" onsubmit="grantAccess(event,'${esc(id)}')"><input id="grantUser" placeholder="用户 ID（可选）"><input id="grantAgent" placeholder="Agent ID（可选）"><select id="grantRole"><option value="viewer">只读</option><option value="editor">编辑</option></select><button class="wide" type="submit">授予访问</button></form>${(d.items||[]).length?`<table><thead><tr><th>用户</th><th>Agent</th><th>角色</th><th>状态</th><th>操作</th></tr></thead><tbody>${d.items.map(g=>`<tr><td>${esc(g.user_id||'全部')}</td><td>${esc(g.agent_id||'全部')}</td><td>${esc(g.role)}</td><td>${esc(g.status)}</td><td><button onclick="revokeAccess('${esc(id)}','${esc(g.user_id)}','${esc(g.agent_id)}')">撤销</button></td></tr>`).join('')}</tbody></table>`:'<div class="empty">暂无显式授权</div>'}`}catch(e){const el=document.getElementById('grants');if(el)el.innerHTML='<div class="empty">授权加载失败</div>'}}
  async function grantAccess(e,id){e.preventDefault();try{const tenant=document.getElementById('tenant').value.trim();await api('/api/admin/knowledge-bases/'+encodeURIComponent(id)+'/grants',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({tenant_id:tenant||undefined,user_id:document.getElementById('grantUser').value,agent_id:document.getElementById('grantAgent').value,role:document.getElementById('grantRole').value})});showMsg('知识库授权已保存');loadGrants(id)}catch(err){showMsg(err.message,true)}}
  async function revokeAccess(id,user,agent){try{const tenant=document.getElementById('tenant').value.trim();await api('/api/admin/knowledge-bases/'+encodeURIComponent(id)+'/grants',{method:'DELETE',headers:{'Content-Type':'application/json'},body:JSON.stringify({tenant_id:tenant||undefined,user_id:user,agent_id:agent})});showMsg('知识库授权已撤销');loadGrants(id)}catch(err){showMsg(err.message,true)}}
  function sourceTypeChanged(){const type=document.getElementById('sourceType').value;document.getElementById('sourceEndpoint').placeholder=type==='database_readonly'?'数据库连接标识':'地址、目录或连接标识';}
  function sourceMessage(text,error=false){const el=document.getElementById('sourceMsg');el.textContent=text||'';el.className='msg'+(error?' error':'')}
  async function loadSources(){try{const tenant=encodeURIComponent(document.getElementById('tenant').value.trim());const data=await api('/api/admin/data-sources'+(tenant?'?tenant_id='+tenant:''));const items=data.items||[];document.getElementById('sourceList').innerHTML=items.length?`<table><thead><tr><th>名称</th><th>类型</th><th>知识库</th><th>状态</th><th>同步</th><th>操作</th></tr></thead><tbody>${items.map(s=>`<tr><td><strong>${esc(s.name)}</strong><div class="muted">${esc(s.endpoint)}</div></td><td>${esc(s.source_type)}</td><td>${esc(s.knowledge_base_id||'未绑定')}</td><td><span class="pill ${esc(s.status)}">${esc(s.status)}</span><div class="muted">${esc(s.last_error||'')}</div></td><td>${esc(s.last_synced_at||'未同步')}</td><td class="actions"><button onclick="validateSource('${esc(s.id)}')">校验</button><button onclick="startSync('${esc(s.id)}')">同步</button><button onclick="showSyncRuns('${esc(s.id)}')">记录</button><button onclick="toggleSource('${esc(s.id)}','${s.status==='paused'?'active':'paused'}')">${s.status==='paused'?'启用':'暂停'}</button></td></tr>`).join('')}</tbody></table>`:'<div class="empty">暂无数据源</div>'}catch(e){document.getElementById('sourceList').innerHTML='<div class="empty">加载失败</div>';sourceMessage(e.message,true)}}
  async function createSource(e){e.preventDefault();try{let config={};const raw=document.getElementById('sourceConfig').value.trim();if(raw)config=JSON.parse(raw);await api('/api/admin/data-sources',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({tenant_id:document.getElementById('tenant').value.trim()||'local-default',name:document.getElementById('sourceName').value,source_type:document.getElementById('sourceType').value,endpoint:document.getElementById('sourceEndpoint').value,knowledge_base_id:document.getElementById('sourceKb').value,sync_mode:document.getElementById('sourceMode').value,schedule:document.getElementById('sourceSchedule').value,config})});e.target.reset();sourceMessage('数据源已登记');loadSources()}catch(err){sourceMessage(err.message,true)}}
  async function validateSource(id){try{const tenant=encodeURIComponent(document.getElementById('tenant').value.trim());const result=await api('/api/admin/data-sources/'+encodeURIComponent(id)+'/validate'+(tenant?'?tenant_id='+tenant:''));sourceMessage(result.valid?'安全校验通过':'校验失败：'+(result.errors||[]).join('；'),!result.valid)}catch(e){sourceMessage(e.message,true)}}
  async function startSync(id){try{await api('/api/admin/data-sources/'+encodeURIComponent(id)+'/sync',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({tenant_id:document.getElementById('tenant').value.trim()||undefined,trigger:'manual'})});sourceMessage('同步已启动，内容会进入待审核文档');setTimeout(loadSources,500);setTimeout(()=>showSyncRuns(id),900)}catch(e){sourceMessage(e.message,true)}}
  async function showSyncRuns(id){try{const tenant=encodeURIComponent(document.getElementById('tenant').value.trim());const data=await api('/api/admin/data-sources/'+encodeURIComponent(id)+'/sync-runs'+(tenant?'?tenant_id='+tenant:''));const rows=data.items||[];sourceMessage(rows.length?'最近同步：'+rows.map(r=>`${r.id} ${r.status}${r.error?'：'+r.error:''}`).join('；'):'暂无同步记录',false);if(rows.some(r=>r.status==='failed')){const failed=rows.find(r=>r.status==='failed');const ok=confirm('存在失败同步任务，是否重试最近一次失败任务？');if(ok){await api('/api/admin/data-sources/sync-runs/'+encodeURIComponent(failed.id)+'/retry',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({tenant_id:document.getElementById('tenant').value.trim()||undefined})});sourceMessage('重试已启动');setTimeout(loadSources,500)}}}catch(e){sourceMessage(e.message,true)}}
  async function toggleSource(id,status){try{await api('/api/admin/data-sources/'+encodeURIComponent(id)+'/status',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({status,tenant_id:document.getElementById('tenant').value.trim()||undefined})});sourceMessage('数据源状态已更新');loadSources()}catch(e){sourceMessage(e.message,true)}}
  loadKbs();loadSources();
</script>
<script src="/static/page_i18n.js"></script>
</body>
</html>
