<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>邮件通知</title>
<style>body{font:13px system-ui,-apple-system,"Segoe UI",sans-serif;background:#f5f5f7;color:#1d1d1f;margin:0;padding:24px}.panel{max-width:760px;background:#fff;border:1px solid #e5e5ea;border-radius:8px;padding:20px}h1{font-size:18px;margin:0 0 8px}.hint{color:#6e6e73;line-height:1.6;margin-bottom:16px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{display:flex;flex-direction:column;gap:5px;color:#6e6e73}input,select{padding:8px;border:1px solid #d2d2d7;border-radius:5px;font:inherit;color:#1d1d1f}button{padding:8px 14px;border:1px solid #0071e3;border-radius:5px;background:#0071e3;color:#fff;cursor:pointer}button.secondary{background:#fff;color:#0071e3}.events{display:flex;gap:12px;flex-wrap:wrap;margin:12px 0}.actions{display:flex;gap:8px;margin-top:16px}.status{margin-top:12px;color:#6e6e73}.error{color:#c00}</style></head>
<body><main class="panel"><select data-page-language aria-label="Language" style="float:right"><option value="zh-CN">中文</option><option value="en-US">English</option></select><h1 data-i18n="邮件通知">邮件通知</h1><p class="hint" data-i18n="默认关闭。仅向管理员配置的收件人发送指定系统事件；SMTP 密码加密保存，页面不会回显原始密钥。">默认关闭。仅向管理员配置的收件人发送指定系统事件；SMTP 密码加密保存，页面不会回显原始密钥。</p>
<div class="grid"><label data-i18n="SMTP 主机">SMTP 主机<input id="host" placeholder="smtp.example.com"></label><label data-i18n="端口">端口<input id="port" type="number" value="465"></label><label data-i18n="加密方式">加密方式<select id="security"><option value="ssl">SSL</option><option value="starttls">STARTTLS</option><option value="none">无</option></select></label><label data-i18n="发件人">发件人<input id="sender" type="email" placeholder="agent@example.com"></label><label data-i18n="用户名">用户名<input id="username" placeholder="可选"></label><label data-i18n="密码">密码<input id="password" type="password" placeholder="留空保留已有密码"></label><label data-i18n="收件人（逗号分隔）">收件人（逗号分隔）<input id="recipients" placeholder="admin@example.com"></label></div>
<label style="margin-top:12px" data-i18n="启用邮件通知">启用邮件通知 <input id="enabled" type="checkbox" style="width:18px;height:18px;align-self:flex-start"></label><div class="events" id="events"></div>
<hr style="border:0;border-top:1px solid #e5e5ea;margin:22px 0"><h2 style="font-size:15px">通知策略</h2><p class="hint">按事件选择通知通道、最低严重度和冷却时间。策略只影响当前工作区；预览不会真实发送邮件或 Webhook。</p><div class="grid"><label>策略名称<input id="policyName" placeholder="评测异常通知"></label><label>事件类型<select id="policyEvent"><option value="eval.completed">评测完成</option><option value="quota.warning">配额告警</option><option value="jailbreak.alert">安全告警</option><option value="knowledge_gap.created">知识缺口</option><option value="ingestion.failed">入库失败</option></select></label><label>最低严重度<select id="policySeverity"><option value="info">信息</option><option value="warning">警告</option><option value="error">错误</option><option value="critical">严重</option></select></label><label>冷却时间（分钟）<input id="policyCooldown" type="number" min="0" max="10080" value="30"></label><label>站内接收人（用户 ID，逗号分隔）<input id="policyRecipients" placeholder="留空使用事件目标用户"></label></div><div class="events"><strong style="width:100%">通知通道</strong><label style="flex-direction:row;align-items:center"><input id="policyInApp" type="checkbox" checked> 站内</label><label style="flex-direction:row;align-items:center"><input id="policyEmail" type="checkbox"> 邮件</label><label style="flex-direction:row;align-items:center"><input id="policyWebhook" type="checkbox"> Webhook</label></div><div class="actions"><button id="savePolicy">保存策略</button><button class="secondary" id="previewPolicy">预览规则</button></div><div id="policyStatus" class="status"></div><div id="policyList" class="status"></div><div class="actions"><button id="save" data-i18n="保存配置">保存配置</button><button class="secondary" id="test" data-i18n="发送测试邮件">发送测试邮件</button><button class="secondary" id="refresh" data-i18n="刷新投递记录">刷新投递记录</button></div><div id="status" class="status"></div><div id="deliveries" class="status"></div></main>
<script src="/static/page_i18n.js"></script>
<script>
const eventNames={"approval.pending":"账号审批","eval.completed":"评测完成","quota.warning":"配额告警","jailbreak.alert":"安全告警","ingestion.failed":"入库失败","external_api.failed":"开放 API 失败"};
const $=id=>document.getElementById(id); const headers=()=>{const csrf=(document.cookie.match(/(?:^|; )securenexus_csrf=([^;]+)/)||[])[1];return {'Content-Type':'application/json',...(csrf?{'X-CSRF-Token':decodeURIComponent(csrf)}:{})};};
async function api(url,opt={}){const r=await fetch(url,{...opt,headers:{...headers(),...(opt.headers||{})}});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.detail||'请求失败');return d;}
function setStatus(t,error=false){$('status').textContent=t||'';$('status').className='status'+(error?' error':'')}
function renderEvents(selected=[]){$('events').innerHTML='<strong style="width:100%">订阅事件</strong>'+Object.entries(eventNames).map(([k,v])=>`<label style="flex-direction:row;align-items:center"><input type="checkbox" value="${k}" ${selected.includes(k)?'checked':''}> ${v}</label>`).join('')}
async function load(){try{const d=await api('/api/admin/email-notifications/config');const c=d.config||{};$('enabled').checked=!!c.enabled;$('host').value=c.host||'';$('port').value=c.port||465;$('security').value=c.security||'ssl';$('sender').value=c.sender||'';$('username').value=c.username||'';$('password').value='';$('recipients').value=(c.recipients||[]).join(',');renderEvents(c.events||[]);await loadDeliveries()}catch(e){setStatus(e.message,true)}}
async function loadPolicies(){try{const d=await api('/api/admin/governance/notification-policies');$('policyList').innerHTML='<strong>已配置策略</strong><br>'+((d.items||[]).map(x=>`${x.name} · ${x.event_types.join(', ')} · ${x.channels.join(', ')} · 冷却 ${x.cooldown_minutes} 分钟`).join('<br>')||'暂无策略')}catch(e){$('policyStatus').textContent=e.message}}
async function savePolicy(){try{const channels=[];if($('policyInApp').checked)channels.push('in_app');if($('policyEmail').checked)channels.push('email');if($('policyWebhook').checked)channels.push('webhook');const name=$('policyName').value.trim();if(!name||!channels.length)throw Error('策略名称和至少一个通道不能为空');await api('/api/admin/governance/notification-policies',{method:'PUT',body:JSON.stringify({name,event_types:[$('policyEvent').value],channels,min_severity:$('policySeverity').value,cooldown_minutes:Number($('policyCooldown').value),recipient_user_ids:$('policyRecipients').value.split(',').map(v=>v.trim()).filter(Boolean)})});$('policyStatus').textContent='通知策略已保存';loadPolicies()}catch(e){$('policyStatus').textContent=e.message}}
async function previewPolicy(){try{const d=await api('/api/admin/governance/notification-policies/preview',{method:'POST',body:JSON.stringify({event_type:$('policyEvent').value})});$('policyStatus').textContent=`匹配策略 ${d.matching_policies.length} 条；预览不会投递通知。`}catch(e){$('policyStatus').textContent=e.message}}
async function save(){try{const body={enabled:$('enabled').checked,host:$('host').value,port:Number($('port').value),security:$('security').value,sender:$('sender').value,username:$('username').value,password:$('password').value,recipients:$('recipients').value.split(',').map(v=>v.trim()).filter(Boolean),events:[...document.querySelectorAll('#events input:checked')].map(v=>v.value)};await api('/api/admin/email-notifications/config',{method:'PUT',body:JSON.stringify(body)});$('password').value='';setStatus('邮件通知配置已保存')}catch(e){setStatus(e.message,true)}}
async function test(){try{const d=await api('/api/admin/email-notifications/test',{method:'POST',body:'{}'});setStatus(d.sent?'测试邮件已发送':'邮件通知未发送')}catch(e){setStatus(e.message,true)}}
async function loadDeliveries(){try{const d=await api('/api/admin/email-notifications/deliveries?tenant_id=local-default&limit=20');$('deliveries').innerHTML='<strong>最近投递</strong><br>'+((d.items||[]).map(x=>`${x.created_at} · ${x.event_type} · ${x.sent?'成功':'失败'}${x.error?' · '+x.error:''}`).join('<br>')||'暂无记录')}catch(e){$('deliveries').textContent='投递记录加载失败：'+e.message}}
$('save').onclick=save;$('test').onclick=test;$('refresh').onclick=loadDeliveries;$('savePolicy').onclick=savePolicy;$('previewPolicy').onclick=previewPolicy;load();loadPolicies();
</script></body></html>
