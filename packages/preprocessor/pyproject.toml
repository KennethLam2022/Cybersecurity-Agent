[project]
name = "cybersec-preprocessor"
version = "1.0.0"
description = "网络安全知识库预处理管道：ODL(文本PDF) + python-docx(DOCX) + RapidOCR(扫描件)"
requires-python = ">=3.10"
dependencies = [
    "python-docx>=1.1.0",
    "pypdf>=5.0.0",
    "opendataloader-pdf>=1.0.0",
    "pypdfium2>=4.30.0",
    "rapidocr>=3.8.0",
    "openai>=1.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]