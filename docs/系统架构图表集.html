<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><title>系统架构图表</title>

<style>
body{background:#f5f5f5;padding:20px;font-family:'Microsoft YaHei',sans-serif}

<body>

<h1 style="text-align:center;color:#1a478a">网络安全移动运营商智能Agent — 系统架构图表集</h1>
<p style="text-align:center;color:#666">对应《整体功能说明书》各章节，建议配合阅读</p>

<div class="chart-box"><h2>1. 系统整体架构全景图（对应说明书 §1.3）</h2>
<div id="arch" style="width:100%;height:520px"></div></div>

<div class="chart-box"><h2>2. 用户提问→RAG 检索管道流程图（对应说明书 §2.1）</h2>
<div id="rag" style="width:100%;height:680px"></div></div>

<div class="chart-box"><h2>3. 文档预处理流水线（三层去重+三种提取+LLM清洗）（对应说明书 §4）</h2>
<div id="preprocess" style="width:100%;height:520px"></div></div>

<div class="chart-box"><h2>4. Prompt 评测框架 — SRAG质量验证体系（对应说明书 §7）</h2>
<div id="eval" style="width:100%;height:600px"></div></div>

<div class="chart-box"><h2>5. 管理后台功能架构（对应说明书 §10）</h2>
<div id="admin" style="width:100%;height:500px"></div></div>
